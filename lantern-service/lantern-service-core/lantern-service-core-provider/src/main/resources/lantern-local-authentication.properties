# Local database authentication uses the host application's existing data source.
lantern.authenticationConfig.defaultAuthenticationService.authenticationServiceName=lanternDubboAuthentication
lantern.authenticationConfig.authenticationFlowConfig.policyServiceName=lanternDubboAuthentication
lantern.authenticationConfig.authenticationFlowConfig.tokenSpot=header
lantern.authenticationConfig.authenticationFlowConfig.tokenName=Authorization

# Standard Dubbo configuration: local export and invocation, without a registry or RPC listener.
dubbo.application.name=${spring.application.name:lantern-authentication}
dubbo.application.qos-enable=false
dubbo.application.metadata-service-protocol=injvm
dubbo.registry.address=N/A
dubbo.protocol.name=injvm
dubbo.protocol.serialization=fastjson2
dubbo.provider.scope=local
dubbo.provider.group=lantern-authentication
dubbo.consumer.scope=local
dubbo.consumer.group=lantern-authentication
dubbo.consumer.retries=0
dubbo.consumer.parameters.serialization=fastjson2

# Initialize only Lantern tables, retaining existing data.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:lantern-schema.sql

# Local database authentication does not use Redis.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
